<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC', 'Source Han Sans SC', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>relaycheck: Is your LLM relay serving the real model? 你的中转站是真模型吗？</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#111a2b" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/>
  </g>

  <!-- left: name + tagline -->
  <text x="88" y="196" font-size="92" font-weight="800" fill="#f9fafb" letter-spacing="-2">relaycheck</text>
  <rect x="92" y="226" width="118" height="48" rx="10" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.6"/>
  <text x="151" y="260" font-size="28" font-weight="700" fill="#4ade80" text-anchor="middle">验货</text>
  <text x="228" y="260" font-size="24" fill="#9ca3af">open source · MIT · zero runtime deps</text>
  <text x="88" y="352" font-size="40" font-weight="700" fill="#f9fafb">Is your LLM relay serving</text>
  <text x="88" y="402" font-size="40" font-weight="700" fill="#f9fafb">the real model?</text>
  <text x="88" y="462" font-size="36" font-weight="600" fill="#d1d5db">你的中转站是真模型吗？</text>
  <rect x="88" y="512" width="560" height="56" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="110" y="548" font-size="24" fill="#e6edf3" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"><tspan fill="#3fdc7a">$</tspan> npx relaycheck &lt;relay&gt; --model …</text>

  <!-- right: mini verdicts -->
  <g transform="translate(724 150)">
    <rect width="472" height="150" rx="16" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.55" stroke-width="2"/>
    <rect width="10" height="150" rx="5" fill="#22c55e"/>
    <text x="34" y="44" font-size="20" fill="#9ca3af">relay A</text>
    <text x="34" y="94" font-size="34" font-weight="800" fill="#22c55e">✔ 一致 CONSISTENT</text>
    <text x="34" y="130" font-size="22" fill="#d1d5db">p = 0.105 · 4/4 groups pass</text>
  </g>
  <g transform="translate(724 330)">
    <rect width="472" height="150" rx="16" fill="#0f172a" stroke="#ef4444" stroke-opacity="0.6" stroke-width="2"/>
    <rect width="10" height="150" rx="5" fill="#ef4444"/>
    <text x="34" y="44" font-size="20" fill="#9ca3af">relay B</text>
    <text x="34" y="94" font-size="34" font-weight="800" fill="#ef4444">✖ 不一致 INCONSISTENT</text>
    <text x="34" y="130" font-size="22" fill="#d1d5db">p = 8.3e-6 · likely model swap</text>
  </g>
  <text x="724" y="530" font-size="20" fill="#9ca3af">checks identity · protocol · billing · context</text>
</svg>
